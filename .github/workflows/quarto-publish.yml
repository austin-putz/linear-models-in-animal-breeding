name: Render and Deploy Quarto Book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # tinytex: the book ships a PDF as well as the website, and without a
      # LaTeX install `quarto render` fails on the pdf format.
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 'release'
          tinytex: true

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.1'
          use-public-rspm: true

      # Only the packages the drafted chapters actually load. Add to this list
      # as chapters need them -- installing the whole eventual set (sommer,
      # MCMCglmm, coxme, ...) costs many minutes per build for code that does
      # not exist yet.
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::knitr
            any::rmarkdown
            any::Matrix
            any::MASS

      # publish@v2 renders and pushes to the gh-pages branch in one step;
      # a separate `quarto render` before it would just build everything twice.
      - name: Render and deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # On a pull request, build without publishing so breakage is caught early.
      - name: Render only (pull requests)
        if: github.ref != 'refs/heads/main'
        run: quarto render
