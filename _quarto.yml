project:
  type: book
  output-dir: _book
  # Derives the version from the latest git tag and writes _variables.yml,
  # styles/version.tex and _version-bibtex.md before anything renders. The
  # version is never edited by hand -- see plans/versioning_and_feedback.md.
  pre-render: tools/version.R
  resources:
    # Manim clips and their poster stills. Quarto finds the mp4 from the
    # <source> tag but not the poster, so the directory is declared here.
    - assets/video/**

book:
  title: "Linear Models in Animal Breeding"
  subtitle: "A Worked Approach"
  author: "Austin Putz"
  # No `date: today` here: a date that changes on every render identifies
  # nothing. The version and release date come from tools/version.R and are
  # printed in the footer of every page.

  reader-mode: true
  repo-url: https://github.com/austin-putz/linear-models-in-animal-breeding
  repo-actions: [edit, issue]
  # The margin link goes to the book's own reporting page, not to GitHub: that
  # page says which route (issue, pull request, discussion) fits which problem.
  # The link text is set under `language:` below.
  issue-url: https://austin-putz.github.io/linear-models-in-animal-breeding/reporting.html
  search: true
  page-navigation: true
  # Sidebar shows the parts only; a part expands when you click it, or
  # automatically when you are reading inside it. Fully expanded, the 24
  # chapters plus 9 appendices make the sidebar several screens long.
  sidebar:
    collapse-level: 1
  # Puts a download link for the built PDF in the site navbar.
  downloads: [pdf]

  chapters:
    - index.qmd

    - part: "Part I: Background"
      chapters:
        - chapters/01-matrix-algebra.qmd
        - chapters/02-linear-models.qmd
        - chapters/03-mixed-models.qmd
        - chapters/04-relationship-matrices.qmd
        - chapters/05-data-preparation.qmd

    - part: "Part II: Core Animal Models"
      chapters:
        - chapters/06-animal-model.qmd
        - chapters/07-reduced-models.qmd
        - chapters/08-random-environmental.qmd
        - chapters/09-genetic-groups.qmd
        - chapters/10-maternal-effects.qmd

    - part: "Part III: Advanced Model Structures"
      chapters:
        - chapters/11-multivariate.qmd
        - chapters/12-random-regression.qmd
        - chapters/13-social-interaction.qmd

    - part: "Part IV: Categorical and Time-to-Event Traits"
      chapters:
        - chapters/14-threshold-models.qmd
        - chapters/15-survival-analysis.qmd

    - part: "Part V: Non-additive Genetic Effects"
      chapters:
        - chapters/16-dominance.qmd
        - chapters/17-epistasis.qmd

    - part: "Part VI: Multibreed and Crossbred Evaluation"
      chapters:
        - chapters/18-multibreed.qmd
        - chapters/19-crossbred-ccps.qmd

    - part: "Part VII: Variance Component Estimation"
      chapters:
        - chapters/20-anova-henderson.qmd
        - chapters/21-reml.qmd
        - chapters/22-gibbs-sampling.qmd

    - part: "Part VIII: Validation and Computation"
      chapters:
        - chapters/23-validation.qmd
        - chapters/24-computing.qmd

    - part: "Appendices"
      chapters:
        - appendices/A-notation-reference.qmd
        - appendices/B-blup-derivation.qmd
        - appendices/C-inbreeding-algorithms.qmd
        - appendices/D-legendre-polynomials.qmd
        - appendices/E-deregression.qmd
        - appendices/F-r-code-reference.qmd
        - appendices/G-datasets.qmd
        - appendices/H-solutions.qmd
        - appendices/I-blupf90-guide.qmd

    - reporting.qmd
    - references.qmd

  page-footer:
    left: "© 2025–{{< var year >}} Austin Putz · Version {{< var version >}} ({{< var released >}})"
    right:
      - icon: github
        href: https://github.com/austin-putz/linear-models-in-animal-breeding
      - text: "License: CC BY-NC-SA 4.0 (text) · MIT (code)"
        href: https://github.com/austin-putz/linear-models-in-animal-breeding/blob/main/LICENSE

bibliography: references.bib

language:
  repo-action-links-issue: "Report an error or suggest a change"
# csl: genetics.csl   # TODO: add genetics.csl to repo, then re-enable

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles/custom.css
    # Code is visible by default. The R is teaching material a student reads
    # and retypes, not an appendix — see the "Code visible" rule in CLAUDE.md.
    # Individual incidental chunks may set `code-fold: true` with a reason.
    code-fold: false
    code-tools: true
    code-copy: true
    code-overflow: wrap
    code-line-numbers: false
    toc: true
    toc-depth: 3
    toc-expand: 2
    number-sections: true
    number-depth: 3
    link-external-newwindow: true
    link-external-icon: true
    citations-hover: true
    footnotes-hover: true
    # Click any figure to enlarge. The Chapter 1 overview infographic is dense
    # enough that reading it inline is not realistic.
    lightbox: auto
    fig-width: 8
    fig-height: 6
    fig-dpi: 300
    df-print: kable
    html-math-method: katex
    callout-appearance: default
    callout-icon: true

  pdf:
    documentclass: book
    # version.tex is generated by tools/version.R and must come first so the
    # preamble can print \bookversion in the page footer.
    include-in-header:
      - styles/version.tex
      - styles/pdf-preamble.tex
    classoption: [oneside, openany]
    geometry: margin=1in
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 3
    code-line-numbers: true
    highlight-style: github
    keep-tex: false

execute:
  freeze: auto
  cache: true
  warning: false
  message: false
  echo: true

knitr:
  opts_chunk:
    comment: "#>"
    collapse: true
    fig.align: "center"
    out.width: "80%"
    dpi: 300

editor: visual
